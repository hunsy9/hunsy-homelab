# Argo CD Helm values for the kubeadm learning cluster.
# Bootstrapped once by Ansible, then managed by Argo CD itself through sites/controller/argocd/application.yaml.

global:
  nodeSelector:
    kubernetes.io/hostname: k8s-control-01
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configs:
  params:
    server.insecure: true

server:
  service:
    type: ClusterIP

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-server
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        app.kubernetes.io/name: argocd-server
        app.kubernetes.io/part-of: argocd
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: public-gateway
          namespace: gateway-system
          sectionName: http
      hostnames:
        - argocd.seung.site
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: argocd-server
              port: 80
              weight: 1
