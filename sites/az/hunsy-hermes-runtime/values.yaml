namespace:
  create: true
  name: hunsy-hermes-runtime

image:
  repository: ghcr.io/hunsy9/hunsy-hermes-runtime
  tag: sha-2460691
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  kubernetes.io/hostname: k8s-worker-01

service:
  type: ClusterIP
  port: 8642

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

env:
  apiServerEnabled: "true"
  apiServerHost: "0.0.0.0"
  apiServerPort: "8642"

apiServerKeySecret:
  name: hermes-api-server-key
  key: key

authJsonSecret:
  name: hermes-auth-json
  key: auth.json

hermesConfig:
  model:
    provider: openai-codex
    default: gpt-5.5
  toolsets:
    - hermes-api-server
  mcp_servers:
    asset:
      url: http://hunsy-assets-mcp.hunsy-assets-mcp.svc.cluster.local:8080/mcp
      timeout: 120
      connect_timeout: 60
  terminal:
    backend: local
