namespace:
  create: true
  name: hunsy-assets-mcp

image:
  repository: ghcr.io/hunsy9/hunsy-asset-platform/assets-mcp
  tag: sha-945b53a
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  kubernetes.io/hostname: k8s-worker-01

service:
  name: hunsy-assets-mcp
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  assetApiBaseUrl: http://hunsy-asset-platform-api.hunsy-asset-platform.svc.cluster.local
  requestTimeoutSeconds: "10"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
