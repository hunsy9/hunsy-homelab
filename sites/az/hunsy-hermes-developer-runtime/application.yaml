apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hunsy-hermes-developer-runtime
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      path: charts/hunsy-hermes-runtime
      helm:
        releaseName: hunsy-hermes-developer-runtime
        valueFiles:
          - $values/sites/az/hunsy-hermes-developer-runtime/values.yaml
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: hunsy-bot
  syncPolicy:
    # Manual sync during cross-namespace PVC migration; re-enable after verification.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
