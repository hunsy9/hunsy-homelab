namespace:
  create: true
  name: hunsy-asset-platform

image:
  repository: ghcr.io/hunsy9/hunsy-asset-platform/api-server
  tag: sha-05c774f
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

replicaCount: 2

nodeSelector:
  kubernetes.io/hostname: k8s-worker-01

service:
  name: hunsy-asset-platform-api
  port: 80
  targetPort: 8000

env:
  spreadsheetId: 1mOK6yewHRYXSbn532lhUZr-YrSCPVafWa1Rg4pXW5Ho
  googleCredentialsFile: /var/run/secrets/google/service-account.json
  humanSheetsEnabled: true

googleServiceAccountSecret:
  name: google-service-account
  key: service-account.json
  mountPath: /var/run/secrets/google

toss:
  enabled: true
  credentialsSecret:
    name: toss-api-credentials
    clientIdKey: client_id
    clientSecretKey: client_secret

snapshotCronJob:
  enabled: true
  schedule: "10 0 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2

httpRoutes:
  - enabled: true
    name: hunsy-asset-dashboard
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public-gateway
        namespace: gateway-system
        sectionName: http
    hostnames:
      - asset.seung.site
    rules:
      - matches:
          - path:
              type: Exact
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: hunsy-asset-platform-api
            port: 80
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /assets
        backendRefs:
          - group: ""
            kind: Service
            name: hunsy-asset-platform-api
            port: 80
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /icons
          - path:
              type: Exact
              value: /manifest.webmanifest
          - path:
              type: Exact
              value: /sw.js
          - path:
              type: Exact
              value: /offline.html
        backendRefs:
          - group: ""
            kind: Service
            name: hunsy-asset-platform-api
            port: 80
            weight: 1
