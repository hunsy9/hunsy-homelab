apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hunsy-bot-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hunsy9/hunsy-homelab.git
    targetRevision: main
    path: charts/hunsy-bot-namespace
    helm:
      releaseName: hunsy-bot-namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: hunsy-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
