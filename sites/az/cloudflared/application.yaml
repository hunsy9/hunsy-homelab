apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      path: charts/cloudflared
      helm:
        releaseName: cloudflared
        valueFiles:
          - $values/sites/az/cloudflared/values.yaml
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
