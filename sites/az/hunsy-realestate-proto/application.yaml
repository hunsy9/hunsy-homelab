apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hunsy-realestate-proto
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      path: charts/hunsy-realestate-proto
      helm:
        releaseName: hunsy-realestate-proto
        valueFiles:
          - $values/sites/az/hunsy-realestate-proto/values.yaml
    - repoURL: https://github.com/hunsy9/hunsy-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: hunsy-hermes-runtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
