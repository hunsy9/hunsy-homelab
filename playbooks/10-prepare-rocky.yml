---
- name: Prepare Rocky Linux nodes for Kubernetes experiments
  hosts: all
  gather_facts: true

  tasks:
    - name: Set static hostname from inventory
      ansible.builtin.hostname:
        name: "{{ node_hostname }}"

    - name: Manage local host entries for homelab nodes
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOMELAB HOSTS"
        block: |
          {% for host in managed_hosts %}
          {{ host.ip }} {{ host.names | join(' ') }}
          {% endfor %}

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0
      changed_when: true

    - name: Ensure swap entries are absent from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.*\sswap\s.*)$'
        replace: '# \1'

    - name: Ensure required kernel modules config exists
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure Kubernetes networking sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install baseline packages
      ansible.builtin.dnf:
        name:
          - curl
          - vim
          - git
          - chrony
          - tar
          - iproute-tc
        state: present

    - name: Enable chronyd
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started
