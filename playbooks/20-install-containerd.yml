---
- name: Install and configure containerd for kubeadm
  hosts: all
  gather_facts: false

  vars:
    docker_repo_path: /etc/yum.repos.d/docker-ce.repo
    containerd_config_dir: /etc/containerd
    containerd_config_path: /etc/containerd/config.toml

  tasks:
    - name: Ensure Docker CE repository is already configured
      ansible.builtin.stat:
        path: "{{ docker_repo_path }}"
      register: docker_repo_file

    - name: Stop if Docker CE repository is missing
      ansible.builtin.assert:
        that:
          - docker_repo_file.stat.exists
        fail_msg: "Docker CE repository is missing. Run playbooks/20-add-docker-repo.yml first."

    - name: Install containerd package
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    - name: Ensure containerd config directory exists
      ansible.builtin.file:
        path: "{{ containerd_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check whether containerd config exists
      ansible.builtin.stat:
        path: "{{ containerd_config_path }}"
      register: containerd_config

    - name: Check whether containerd CRI plugin is disabled by packaged config
      ansible.builtin.command: grep -q '^disabled_plugins = \["cri"\]' "{{ containerd_config_path }}"
      register: containerd_cri_disabled
      changed_when: false
      failed_when: false
      when: containerd_config.stat.exists

    - name: Generate default containerd config
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false
      when:
        - not containerd_config.stat.exists or containerd_cri_disabled.rc | default(1) == 0
        - not ansible_check_mode

    - name: Write default containerd config
      ansible.builtin.copy:
        dest: "{{ containerd_config_path }}"
        owner: root
        group: root
        mode: '0644'
        content: "{{ containerd_default_config.stdout }}\n"
      when:
        - not containerd_config.stat.exists or containerd_cri_disabled.rc | default(1) == 0
        - not ansible_check_mode
      notify: Restart containerd

    - name: Check whether generated containerd config exists after creation
      ansible.builtin.stat:
        path: "{{ containerd_config_path }}"
      register: containerd_config_after

    - name: Use systemd cgroup driver for runc
      ansible.builtin.replace:
        path: "{{ containerd_config_path }}"
        regexp: '^([\s]*SystemdCgroup\s*=\s*)false$'
        replace: '\1true'
      when: containerd_config_after.stat.exists
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Verify containerd is active
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_active
      changed_when: false
      failed_when: containerd_active.stdout.strip() != 'active'
      when: not ansible_check_mode

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
