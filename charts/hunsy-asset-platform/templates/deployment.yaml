apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      volumes:
        - name: google-service-account
          secret:
            secretName: {{ .Values.googleServiceAccountSecret.name | quote }}
      containers:
        - name: api-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            - name: ASSET_SPREADSHEET_ID
              value: {{ .Values.env.spreadsheetId | quote }}
            - name: ASSET_GOOGLE_CREDENTIALS_FILE
              value: {{ printf "%s/%s" .Values.googleServiceAccountSecret.mountPath .Values.googleServiceAccountSecret.key | quote }}
            - name: ASSET_HUMAN_SHEETS_ENABLED
              value: {{ .Values.env.humanSheetsEnabled | quote }}
            - name: ASSET_TOSS_ENABLED
              value: {{ .Values.toss.enabled | quote }}
            {{- if .Values.toss.enabled }}
            - name: ASSET_TOSS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.toss.credentialsSecret.name | quote }}
                  key: {{ .Values.toss.credentialsSecret.clientIdKey | quote }}
            - name: ASSET_TOSS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.toss.credentialsSecret.name | quote }}
                  key: {{ .Values.toss.credentialsSecret.clientSecretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: google-service-account
              mountPath: {{ .Values.googleServiceAccountSecret.mountPath | quote }}
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
