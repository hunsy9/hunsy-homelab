apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hunsy-hermes-runtime.name" . | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: {{ include "hunsy-hermes-runtime.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
data:
  git-askpass.sh: |
    #!/bin/sh
    case "$1" in
      *Username*) printf '%s\n' "${GITHUB_USER:-x-access-token}" ;;
      *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
      *) printf '%s\n' "$GITHUB_TOKEN" ;;
    esac
  config.yaml: |
    model:
      provider: {{ .Values.hermesConfig.model.provider | quote }}
      default: {{ .Values.hermesConfig.model.default | quote }}
    toolsets:
{{ toYaml .Values.hermesConfig.toolsets | indent 6 }}
{{- with .Values.hermesConfig.compression }}
    compression:
{{ toYaml . | indent 6 }}
{{- end }}
{{- with .Values.hermesConfig.mcp_servers }}
    mcp_servers:
{{ toYaml . | indent 6 }}
{{- end }}
    terminal:
      backend: {{ .Values.hermesConfig.terminal.backend | quote }}
{{- if .Values.context.enabled }}
  SOUL.md: |
{{- with .Values.context.userCore }}
{{ . | indent 4 }}
{{- end }}
{{- with .Values.context.soul }}
{{ . | indent 4 }}
{{- end }}
  .hermes.md: |
{{ .Values.context.project | indent 4 }}
{{- end }}
