apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
data:
  config.yaml: |
    model:
      provider: {{ .Values.hermesConfig.model.provider | quote }}
      default: {{ .Values.hermesConfig.model.default | quote }}
    toolsets:
{{ toYaml .Values.hermesConfig.toolsets | indent 6 }}
{{- with .Values.hermesConfig.mcp_servers }}
    mcp_servers:
{{ toYaml . | indent 6 }}
{{- end }}
    terminal:
      backend: {{ .Values.hermesConfig.terminal.backend | quote }}
