apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hunsy-hermes-runtime.name" . | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: {{ include "hunsy-hermes-runtime.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hunsy-hermes-runtime.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "hunsy-hermes-runtime.name" . | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
{{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "hunsy-hermes-runtime.name" .) | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: hermes-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: API_SERVER_ENABLED
              value: {{ .Values.env.apiServerEnabled | quote }}
            - name: API_SERVER_HOST
              value: {{ .Values.env.apiServerHost | quote }}
            - name: API_SERVER_PORT
              value: {{ .Values.env.apiServerPort | quote }}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiServerKeySecret.name | quote }}
                  key: {{ .Values.apiServerKeySecret.key | quote }}
{{- if .Values.gitSsh.enabled }}
            - name: GIT_SSH_COMMAND
              value: "ssh -i /opt/data/.ssh/id_ed25519 -o UserKnownHostsFile=/opt/data/.ssh/known_hosts -o IdentitiesOnly=yes"
{{- end }}
{{- if .Values.githubToken.enabled }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubToken.secretName | quote }}
                  key: {{ .Values.githubToken.key | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubToken.secretName | quote }}
                  key: {{ .Values.githubToken.key | quote }}
            - name: GIT_ASKPASS
              value: /opt/data/git-askpass.sh
            - name: GIT_TERMINAL_PROMPT
              value: "0"
{{- end }}
{{- if .Values.discord.enabled }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.botTokenSecret.name | quote }}
                  key: {{ .Values.discord.botTokenSecret.key | quote }}
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.allowedUsersSecret.name | quote }}
                  key: {{ .Values.discord.allowedUsersSecret.key | quote }}
            - name: DISCORD_HOME_CHANNEL
              value: {{ .Values.discord.homeChannel | quote }}
            - name: DISCORD_HOME_CHANNEL_NAME
              value: {{ .Values.discord.homeChannelName | quote }}
            - name: DISCORD_REPLY_TO_MODE
              value: {{ .Values.discord.replyToMode | quote }}
            - name: DISCORD_REQUIRE_MENTION
              value: {{ .Values.discord.requireMention | quote }}
{{- with .Values.discord.freeResponseChannels }}
            - name: DISCORD_FREE_RESPONSE_CHANNELS
              value: {{ join "," . | quote }}
{{- end }}
            - name: DISCORD_FREE_RESPONSE_AUTO_THREAD
              value: {{ .Values.discord.freeResponseAutoThread | quote }}
{{- with .Values.discord.allowedChannels }}
            - name: DISCORD_ALLOWED_CHANNELS
              value: {{ join "," . | quote }}
{{- end }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: hermes-config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: hermes-auth-json
              mountPath: /opt/data/auth.json
              subPath: auth.json
              readOnly: true
{{- if .Values.githubToken.enabled }}
            - name: hermes-config
              mountPath: /opt/data/git-askpass.sh
              subPath: git-askpass.sh
              readOnly: true
{{- end }}
{{- if .Values.gitSsh.enabled }}
            - name: git-ssh
              mountPath: /opt/data/.ssh/id_ed25519
              subPath: {{ .Values.gitSsh.keyFile | quote }}
              readOnly: true
            - name: git-ssh
              mountPath: /opt/data/.ssh/known_hosts
              subPath: {{ .Values.gitSsh.knownHostsFile | quote }}
              readOnly: true
{{- end }}
{{- if .Values.context.enabled }}
            - name: hermes-config
              mountPath: /opt/data/SOUL.md
              subPath: SOUL.md
              readOnly: true
            - name: hermes-config
              mountPath: /workspace/.hermes.md
              subPath: .hermes.md
              readOnly: true
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: hermes-config
          configMap:
            name: {{ include "hunsy-hermes-runtime.name" . | quote }}
            defaultMode: 0550
        - name: hermes-auth-json
          secret:
            secretName: {{ .Values.authJsonSecret.name | quote }}
            items:
              - key: {{ .Values.authJsonSecret.key | quote }}
                path: auth.json
{{- if .Values.gitSsh.enabled }}
        - name: git-ssh
          secret:
            secretName: {{ .Values.gitSsh.secretName | quote }}
            defaultMode: 0440
{{- end }}
