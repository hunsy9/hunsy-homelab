namespace:
  create: true
  name: hunsy-hermes-runtime

fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/hunsy9/hunsy-hermes-runtime
  tag: sha-2460691
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

nodeSelector:
  kubernetes.io/hostname: k8s-worker-01

podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch

serviceAccount:
  create: false
  name: ""
  automountToken: true

rbac:
  enabled: false
  argocdApplications:
    enabled: false
    namespace: argocd

service:
  type: ClusterIP
  port: 8642

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

env:
  apiServerEnabled: "true"
  apiServerHost: "0.0.0.0"
  apiServerPort: "8642"

apiServerKeySecret:
  name: hermes-api-server-key
  key: key

authJsonSecret:
  name: hermes-auth-json
  key: auth.json

discord:
  enabled: false
  botTokenSecret:
    name: discord-bot-token
    key: token
  allowedUsersSecret:
    name: discord-allowed-users
    key: users
  homeChannel: ""
  homeChannelName: ""
  replyToMode: first
  requireMention: "true"
  freeResponseChannels: []
  freeResponseAutoThread: "false"
  allowedChannels: []

context:
  enabled: false
  userCore: ""
  soul: ""
  project: ""

hermesConfig:
  model:
    provider: openai-codex
    default: gpt-5.5
  toolsets:
    - hermes-api-server
  mcp_servers: {}
  terminal:
    backend: local
