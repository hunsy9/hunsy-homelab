apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: {{ include "local-path-provisioner.namespace" . | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.json: |-
    {
      "nodePathMap": {{ toJson .Values.nodePathMap }}
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: {{ .Values.helperPod.image | quote }}
          imagePullPolicy: {{ .Values.helperPod.imagePullPolicy | quote }}
