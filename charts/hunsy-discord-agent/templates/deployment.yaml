apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: discord-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBotTokenSecret.name | quote }}
                  key: {{ .Values.discordBotTokenSecret.key | quote }}
            - name: ASSET_API_BASE_URL
              value: {{ .Values.env.assetApiBaseUrl | quote }}
            - name: HERMES_API_BASE_URL
              value: {{ .Values.env.hermesApiBaseUrl | quote }}
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermesApiServerKeySecret.name | quote }}
                  key: {{ .Values.hermesApiServerKeySecret.key | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
