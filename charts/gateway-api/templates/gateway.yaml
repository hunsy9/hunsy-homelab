{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | quote }}
  namespace: {{ .Values.gateway.namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name | quote }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateway.infrastructure.envoyProxyName | quote }}
  listeners:
{{- range .Values.gateway.listeners }}
    - name: {{ .name | quote }}
      protocol: {{ .protocol | quote }}
      port: {{ .port }}
{{- if .hostname }}
      hostname: {{ .hostname | quote }}
{{- end }}
{{- if .allowedRoutes }}
      allowedRoutes:
{{ toYaml .allowedRoutes | indent 8 }}
{{- end }}
{{- end }}
{{- end }}
