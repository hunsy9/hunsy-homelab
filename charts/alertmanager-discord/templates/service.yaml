apiVersion: v1
kind: Service
metadata:
  name: alertmanager-discord
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: alertmanager-discord
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: alertmanager-discord
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
